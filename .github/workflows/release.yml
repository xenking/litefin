name: WebOS Main Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create empty sign directory
        run: mkdir -p .sign

      - name: Build webOS package
        run: npm run package:webos

      - name: Generate Homebrew Manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          IPK_FILE=$(ls -1 *.ipk | head -n 1)
          SHA256=$(sha256sum "$IPK_FILE" | cut -d ' ' -f 1)

          cat <<EOF > manifest.json
          {
            "id": "org.litefin.app",
            "version": "$VERSION",
            "type": "web",
            "title": "Litefin",
            "appDescription": "Native Jellyfin client for WebOS",
            "iconUri": "https://raw.githubusercontent.com/MoazSalem/litefin/development/icon-130.png",
            "sourceUrl": "https://github.com/MoazSalem/litefin",
            "rootRequired": false,
            "ipkUrl": "$IPK_FILE",
            "ipkHash": {
              "sha256": "$SHA256"
            }
          }
          EOF

          echo "ipk_file=$IPK_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        id: release_body
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          FOOTER=$(cat .github/RELEASE_NOTES_FOOTER.md)

          {
            echo "content<<EOF"
            echo "Automated webOS build from main."
            echo
            echo "- Version: ${VERSION}"
            echo "- Commit: ${SHORT_SHA}"
            echo "- Build artifact: ${{ steps.manifest.outputs.ipk_file }}"
            echo
            echo "$FOOTER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish/Update main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-webos
          target_commitish: ${{ github.sha }}
          name: Main webOS build
          body: ${{ steps.release_body.outputs.content }}
          prerelease: true
          make_latest: false
          files: |
            *.ipk
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
