name: WebOS Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
      - 'xk-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create empty sign directory
        run: mkdir -p .sign

      - name: Build legacy bundle for smoke test
        run: npx webpack --config webpack.config.cjs --config-name legacy

      - name: Smoke-test bundle (catch module-level TypeErrors)
        run: |
          npm install --no-save --prefer-offline --no-audit --no-fund jsdom@25
          node scripts/smoke-test.mjs

      - name: Build webOS package
        run: npm run package:webos

      - name: Collect IPK and manifest
        id: ipk
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          IPK_FILE=$(find . -maxdepth 1 -type f -name '*.ipk' -print -quit | sed 's#^\./##')
          if [[ -z "$IPK_FILE" ]]; then
            echo "No IPK file was generated by npm run package:webos" >&2
            exit 1
          fi
          SHA256=$(sha256sum "$IPK_FILE" | cut -d ' ' -f 1)

          cat <<EOF > manifest.json
          {
            "id": "org.litefin.app",
            "version": "$VERSION",
            "type": "web",
            "title": "Litefin",
            "appDescription": "Native Jellyfin client for WebOS",
            "iconUri": "https://raw.githubusercontent.com/MoazSalem/litefin/development/icon-130.png",
            "sourceUrl": "https://github.com/xenking/litefin",
            "rootRequired": false,
            "ipkUrl": "$IPK_FILE",
            "ipkHash": {
              "sha256": "$SHA256"
            }
          }
          EOF

          echo "ipk_file=$IPK_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Determine release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG"               >> "$GITHUB_OUTPUT"
            echo "release_name=Litefin $TAG"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"            >> "$GITHUB_OUTPUT"
            echo "make_latest=true"            >> "$GITHUB_OUTPUT"
            echo "rolling=false"               >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=release-webos"      >> "$GITHUB_OUTPUT"
            echo "release_name=Rolling webOS build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"             >> "$GITHUB_OUTPUT"
            echo "make_latest=false"           >> "$GITHUB_OUTPUT"
            echo "rolling=true"                >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release body
        id: release_body
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.ipk.outputs.version }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          FOOTER=""
          if [[ -f .github/RELEASE_NOTES_FOOTER.md ]]; then
            FOOTER=$(cat .github/RELEASE_NOTES_FOOTER.md)
          fi

          {
            echo "content<<NOTES_EOF"
            if [[ "${{ steps.target.outputs.rolling }}" == "true" ]]; then
              echo "Automated webOS build from release branch."
            else
              echo "Automated webOS build for tag ${{ steps.target.outputs.tag_name }}."
            fi
            echo
            echo "- Version: ${VERSION}"
            echo "- Commit: ${SHORT_SHA}"
            echo "- Artifact: ${{ steps.ipk.outputs.ipk_file }}"
            echo "- SHA256: \`${{ steps.ipk.outputs.sha256 }}\`"
            echo
            if [[ -n "$FOOTER" ]]; then
              echo "$FOOTER"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Clean rolling release assets
        if: steps.target.outputs.rolling == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.target.outputs.tag_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view "${{ steps.target.outputs.tag_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [[ -n "$asset" ]] || continue
                gh release delete-asset "${{ steps.target.outputs.tag_name }}" "$asset" --repo "${{ github.repository }}" -y || true
              done
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag_name }}
          name: ${{ steps.target.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_body.outputs.content }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          files: |
            ${{ steps.ipk.outputs.ipk_file }}
            manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
